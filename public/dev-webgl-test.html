<!doctype html>
<html><head><meta charset="utf-8"/><title>webgl-headless-test</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<script type="module">
  import * as THREE from '/vendor/three.module.js';
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(640, 360);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a1226);
  const cam = new THREE.PerspectiveCamera(55, 640 / 360, 0.1, 100);
  cam.position.set(0, 1.2, 4);
  const mat = new THREE.MeshStandardMaterial({ color: 0x2e86ff, roughness: 0.35, metalness: 0.6 });
  const cube = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), mat);
  scene.add(cube);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x14203a, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -1; scene.add(ground);
  const sun = new THREE.DirectionalLight(0xffe9c4, 3.2);
  sun.position.set(3, 5, 2); sun.castShadow = true; scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x9db8ff, 0x1a2438, 0.7));
  renderer.shadowMap.enabled = true;
  let t = 0;
  renderer.setAnimationLoop(() => { t += 0.01; cube.rotation.y = t; cube.rotation.x = t * 0.6; renderer.render(scene, cam); });
</script>
</body></html>
